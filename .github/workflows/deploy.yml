# Deploys to Hostinger over SSH (docs/DEPLOYMENT.md).
#   push to "staging" → environment "staging"    (new.hatpakha.com)
#   push to "main"    → environment "production" (hatpakha.com)
# All values come from GitHub → Settings → Environments → <env> → Secrets. Nothing secret is in the repo.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test before deploying
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci && npm run build
          cp .env.example .env && php artisan key:generate
          php artisan test
          rm .env

      - name: Build production bundle
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Refuse unsafe deploy paths
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # The Laravel root (with .env, vendor, storage) must never sit inside a web root (docs/DEPLOYMENT.md).
          case "$DEPLOY_PATH" in
            ''|*public_html*|*/www/*|*/htdocs*) echo "DEPLOY_PATH must be outside public_html, e.g. /home/<user>/apps/hatpakha-staging"; exit 1 ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Show "coming back soon" before touching any file
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Pre-rendered page (storage/framework/maintenance.php) is served by public/index.php before
          # Laravel boots, so visitors see it even while vendor/ is half uploaded. Never fails the deploy.
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "cd '${DEPLOY_PATH}' && \
            { php artisan down --render=errors::503 --retry=30 --refresh=30 2>/dev/null || php artisan down --retry=30 || true; }"

      - name: Upload code (keeps .env, storage and old media on the server)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='tests' \
            --exclude='/.env' --exclude='/storage/' --exclude='/public/storage' \
            --include='/public/wp-content/uploads/.htaccess' --exclude='/public/wp-content/uploads/*' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Write .env and run release tasks
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "umask 077 && cat > '${DEPLOY_PATH}/.env'"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" "cd '${DEPLOY_PATH}' && \
            php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);' || { echo 'Server CLI PHP is older than 8.3:'; php -v; exit 1; } && \
            { [ -L public/storage ] || rm -rf public/storage; } && \
            mkdir -p storage/framework/{cache,sessions,views} storage/logs storage/app/public storage/app/private && \
            { [ -L public/storage ] || php artisan storage:link; } && \
            { php artisan db:show --json >/dev/null || { echo 'Cannot connect to the database: check DB_HOST/DB_DATABASE/DB_USERNAME/DB_PASSWORD in ENV_FILE. The "back soon" page stays up until this is fixed and redeployed.'; exit 1; }; } && \
            php artisan down --render=errors::503 --retry=30 --refresh=30 || true; \
            php artisan migrate --force && \
            php artisan db:seed --force && \
            php artisan optimize:clear && php artisan optimize && \
            php artisan filament:optimize && \
            php artisan up"

      # Staging only, and only when the commit message contains [run-blind-test] (owner asked to run it).
      # The command estimates first and stops above $6 (≈ ₹500); see docs/AI.md.
      - name: AI blind test (on request)
        if: github.ref_name == 'staging' && contains(github.event.head_commit.message, '[run-blind-test]')
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' && php artisan hatpakha:ai-blind-test --count=30 --max-usd=6 --force --no-ansi"

      # Staging only, when the commit message contains [run-ai-editor]: the AI editor prepares the
      # backlog packages and cover illustrations for the owner's approval (D42/D43). Never publishes.
      # Two pieces first in the open (so a broken setup shows here), the rest in the background on the
      # server (hours of work must not hold the deploy). Log: storage/logs/ai-editor.log
      - name: AI editor batch (on request)
        if: github.ref_name == 'staging' && contains(github.event.head_commit.message, '[run-ai-editor]')
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' && php artisan hatpakha:ai-editor --backlog --images --dry --no-ansi && \
             php artisan hatpakha:ai-editor --backlog --limit=2 --no-ansi && \
             (nohup php artisan hatpakha:ai-editor --backlog --images --no-ansi > storage/logs/ai-editor.log 2>&1 < /dev/null &) && \
             echo 'Batch continues in the background: storage/logs/ai-editor.log'"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
