# Runs on every push and pull request. A red CI blocks deploys (deploy.yml needs this to pass).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'          # same as Hostinger
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (SEO + security rules are enforced here)
        run: php artisan test

      - name: Dependency security audit
        run: |
          # Retry only when the advisory download fails (network); real findings still fail the build.
          for i in 1 2 3; do
            set +e; out=$(composer audit --no-interaction 2>&1); code=$?; set -e
            echo "$out"
            if [ $code -eq 0 ]; then break; fi
            if echo "$out" | grep -q "curl error"; then echo "Network error, retrying in $((i*15))s"; sleep $((i*15)); else exit $code; fi
            if [ $i -eq 3 ]; then exit $code; fi
          done
          npm audit --omit=dev --audit-level=high
